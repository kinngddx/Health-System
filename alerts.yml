groups:
  - name: fastapi-alerts
    rules:

      - alert: HighErrorRate
        expr: rate(api_errors_total[2m]) > 0.02
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API Error Rate"
          description: "API error rate exceeded 2%."

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Request Latency"
          description: "95th percentile request latency exceeded 500 ms."

      - alert: HighDBLatency
        expr: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket[5m])) by (le)) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Database Latency"
          description: "95th percentile database query latency exceeded 2 seconds."

      - alert: HighActiveRequests
        expr: active_requests > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Active Requests"
          description: "More than 10 active requests are being processed."

      - alert: ServiceDown
        expr: up{job="fastapi-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "FastAPI Service Down"
          description: "FastAPI service is unreachable."
          