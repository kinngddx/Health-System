# Promtail kya karta hai — Docker containers ke logs uthata hai aur Loki me bhejta hai.


server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: fastapi-app
          __path__: /var/log/docker/*.log